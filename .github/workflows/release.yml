name: Release (build + submit)

# Builds, signs, and submits one .app per architecture. Stops there — does
# NOT wait for notarization. Once Apple accepts (check via Notarization
# status), manually trigger Finalize release with both submission IDs and
# this run's ID to staple, build .dmg per arch, and publish the GitHub
# Release with both .dmgs attached.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + sign + submit; no GitHub Release is produced (artifacts only)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      # Keep going if one arch fails — partial release is still better than no
      # release while we diagnose.
      fail-fast: false
      matrix:
        include:
          # Self-hosted Intel Mac (label `intel-mac`, configured at runner
          # registration time). GitHub's macos-13 fleet is queue-starved.
          - os: [self-hosted, macOS, X64, intel-mac]
            arch: x86_64
          - os: macos-14
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$TAG_VERSION" != "$FILE_VERSION" ]]; then
              echo "Tag $GITHUB_REF_NAME does not match VERSION file ($FILE_VERSION)." >&2
              exit 1
            fi
          fi
          echo "VERSION=$FILE_VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m venv venv
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install -r requirements.txt
          ./venv/bin/pip install 'pyinstaller>=6.0'

      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          echo "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm "$CERT_PATH"

      - name: Build and sign
        env:
          PY: ./venv/bin/python
          DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
        run: scripts/build_and_sign.sh

      - name: Submit for notarization
        id: submit
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          SUBMISSION_ID="$(scripts/submit_notarization.sh)"
          echo "submission_id=$SUBMISSION_ID" >> "$GITHUB_OUTPUT"

      - name: Archive signed .app for cross-run transfer
        run: |
          cd dist
          tar -czf "Keepers-${{ env.VERSION }}-${{ matrix.arch }}-signed.tar.gz" Keepers.app

      - name: Upload signed .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Keepers-${{ env.VERSION }}-${{ matrix.arch }}-signed-app
          path: dist/Keepers-${{ env.VERSION }}-${{ matrix.arch }}-signed.tar.gz
          retention-days: 14

      - name: Print finalize instructions
        run: |
          cat <<EOF
          =======================================================================
          [${{ matrix.arch }}] Build submitted to Apple. To complete the release
          after BOTH archs are Accepted (check Notarization status workflow),
          trigger Finalize release with:
              submission_id_${{ matrix.arch }}: ${{ steps.submit.outputs.submission_id }}
              build_run_id:                       ${{ github.run_id }}
              tag:                                ${{ github.event_name == 'push' && github.ref_name || '(empty for dry run)' }}
          =======================================================================
          EOF

      - name: Clean up ephemeral keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          # `delete-keychain` removes it from the user's search list AND from disk.
          # Matters on self-hosted runners where the search list is the user's real
          # login environment. No-op on GitHub-hosted (VM is thrown away anyway).
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
