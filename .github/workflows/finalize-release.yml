name: Finalize release

# Manually triggered after Apple Accepts BOTH per-arch submissions. Each
# matrix job downloads its arch's signed .app, confirms Apple's verdict,
# staples, builds a per-arch .dmg, and uploads it. A final release job
# downloads both .dmgs and creates a single GitHub Release.

on:
  workflow_dispatch:
    inputs:
      submission_id_x86_64:
        description: "Apple submission ID for the x86_64 (Intel) build"
        type: string
        required: true
      submission_id_arm64:
        description: "Apple submission ID for the arm64 (Apple Silicon) build"
        type: string
        required: true
      build_run_id:
        description: "GitHub run ID of the Release workflow that produced both signed .apps"
        type: string
        required: true
      tag:
        description: "Git tag to publish, e.g. v1.3.2. Leave empty for a dry run (artifacts only, no Release)."
        type: string
        required: false

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Self-hosted Intel Mac (label `intel-mac`). Must be online for
          # this job to pick up.
          - os: [self-hosted, macOS, X64, intel-mac]
            arch: x86_64
          - os: macos-14
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # Use main's scripts, not the tag's. Hotfixes to the finalize scripts
    # should apply to in-flight releases.
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ -n "${{ inputs.tag }}" ]]; then
            TAG_VERSION="${{ inputs.tag }}"
            TAG_VERSION="${TAG_VERSION#v}"
            if [[ "$TAG_VERSION" != "$FILE_VERSION" ]]; then
              echo "Tag ${{ inputs.tag }} does not match VERSION file ($FILE_VERSION)." >&2
              exit 1
            fi
          fi
          echo "VERSION=$FILE_VERSION" >> "$GITHUB_ENV"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Download signed .app from build run
        uses: actions/download-artifact@v4
        with:
          name: Keepers-${{ env.VERSION }}-${{ matrix.arch }}-signed-app
          path: dist/
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unarchive signed .app
        run: |
          cd dist
          tar -xzf "Keepers-${{ env.VERSION }}-${{ matrix.arch }}-signed.tar.gz"
          rm "Keepers-${{ env.VERSION }}-${{ matrix.arch }}-signed.tar.gz"

      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          echo "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm "$CERT_PATH"

      - name: Staple + build .dmg + sign
        env:
          # GitHub Actions has no real ternary; this is the standard
          # cond && a || b workaround. Both inputs are required:true, so
          # the truthiness pitfall doesn't bite us here.
          SUBMISSION_ID: ${{ matrix.arch == 'x86_64' && inputs.submission_id_x86_64 || inputs.submission_id_arm64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          DEVELOPER_ID: ${{ secrets.MACOS_DEVELOPER_ID }}
          ARCH: ${{ matrix.arch }}
          NOTARY_TIMEOUT_SECONDS: "3600"
        run: scripts/finalize_release.sh

      - name: Upload per-arch .dmg
        uses: actions/upload-artifact@v4
        with:
          name: Keepers-${{ env.VERSION }}-${{ matrix.arch }}-dmg
          path: dist/Keepers-${{ env.VERSION }}-${{ matrix.arch }}.dmg
          retention-days: 14

      - name: Clean up ephemeral keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

  release:
    needs: finalize
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION
        run: echo "VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Download all per-arch .dmgs
        uses: actions/download-artifact@v4
        with:
          pattern: Keepers-${{ env.VERSION }}-*-dmg
          path: dmgs/
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        run: |
          python3 - "$VERSION" > release-notes.md <<'PY'
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md").read()
          pattern = rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)"
          m = re.search(pattern, text, flags=re.DOTALL | re.MULTILINE)
          if not m:
              sys.exit(f"No CHANGELOG section for [{version}]")
          sys.stdout.write(m.group(1).strip() + "\n")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Keepers ${{ env.VERSION }}
          body_path: release-notes.md
          files: dmgs/*.dmg
          fail_on_unmatched_files: true
